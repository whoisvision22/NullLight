function applySetupValue(key,newValue){

  delete value.channels;
  value[key]=key==="color"&&!channelMap(light).some(channel=>["R","G","B","W"].includes(channel))?"#ffffff":newValue;
  if(key==="color")value.level=100;
  const cell=screen.querySelector('.cell[data-fixture="'+light.id+'"]');
  if(cell){
   cell.style.setProperty("--lamp",visualColor(light,value));
   cell.style.setProperty("--glow",value.level+"%");
  }
 }

const levelInput=screen.querySelector("#setup-level");

function readColors(container){

function fadeColors(container,previous,seconds){
 if(!seconds||matchMedia("(prefers-reduced-motion: reduce)").matches)return;

  const target=getComputedStyle(node).backgroundColor;
  if(previous[index]&&previous[index]!==target){
   node.animate([{backgroundColor:previous[index]},{backgroundColor:target}],{duration:1000*seconds,easing:"linear"});
  }
 });
}

function schedule(){

else if(performQueue.size){

 if(selected.length)play(selected[(index+1)%selected.length].id);
 else{performQueue.clear();active=null;liveSnapshot=null;outputStep=null;}
}
else if(auto){
   const choices=liveScenes();
   const next=choices[(choices.findIndex(item=>item.id===scene.id)+1)%choices.length];
   if(next)play(next.id);

   if(address<0||address>=512)return;
   let out=0;
   if(channel==="255")out=mode==="black"?0:255;
   else if(channel==="D")out=Math.round(level*255);

function effectStep(step,scene,seconds=performanceClock()){

  if(!layer.enabled)continue;

  const time=layer.reverse?-phase:phase;
  data.lights.forEach((light,index)=>{
   if(layer.ids.length&&!layer.ids.includes(light.id))return;
   const position=fixturePosition(light,index);
   const space=layer.axis==="y"?position.y:layer.axis==="radial"?
    Math.hypot(position.x-.5,position.y-.5)*1.414:position.x;
   const cycle=((space-time)%1+1)%1;

   if(layer.type==="wave")amount=(1+Math.sin(2*Math.PI*(space-time)))/2;

   else if(layer.type==="chase")amount=cycle<layer.width?1:0;
   else if(layer.type==="alternate"){amount=1;color=(Math.floor(time*2+space*8)%2+2)%2?layer.color:layer.color2;}
   else if(layer.type==="rainbow"){
    const hue=((space-time)%1+1)%1;
    const rgb=[0,2/3,1/3].map(offset=>{
     const h=(hue+offset)%1;
     return Math.round(Math.max(0,Math.min(1,Math.abs(h*6-3)-1))*255).toString(16).padStart(2,"0");
    });
    color="#"+rgb.join("");
   }
   const previous=result.values[light.id]||defaultValue;
   const target={color,level:layer.level*amount};
   if(layer.mix==="add"){

   }else if(layer.mix==="multiply"){

}

function drawStage(step){
 const viewport=screen.querySelector(".rig-canvas"),canvas=screen.querySelector(".stage-drawing");
 if(!viewport||!canvas)return;
 const width=viewport.clientWidth,height=viewport.clientHeight;
 if(!width||!height)return;
 const ratio=Math.min(window.devicePixelRatio||1,2);
 if(canvas.width!==Math.round(width*ratio)||canvas.height!==Math.round(height*ratio)){
  canvas.width=Math.round(width*ratio);canvas.height=Math.round(height*ratio);
 }
 const context=canvas.getContext("2d");
 if(!context)return;
 context.setTransform(ratio,0,0,ratio,0,0);
 context.clearRect(0,0,width,height);
 const background=context.createRadialGradient(width*.5,height*.3,0,width*.5,height*.4,width*.75);
 background.addColorStop(0,"#241c35");background.addColorStop(1,"#0c0b13");
 context.fillStyle=background;context.fillRect(0,0,width,height);
 const project=point=>rigView.mode==="3d"?projectRig(point,width,height):
  projectTop(point,width,height);
 function path(points,fill,stroke){
  context.beginPath();points.forEach((point,index)=>{
   const p=project(point);if(index)context.lineTo(p.x,p.y);else context.moveTo(p.x,p.y);
  });context.closePath();
  if(fill){context.fillStyle=fill;context.fill();}
  if(stroke){context.strokeStyle=stroke;context.lineWidth=1;context.stroke();}
 }
 function line(a,b,color,lineWidth=1){
  const first=project(a),last=project(b);

  context.strokeStyle=color;context.lineWidth=lineWidth;context.stroke();
 }
 const size=stageSize(),w=size.width/2,d=size.depth/2;
 const floor=[{x:-w,y:-d,z:0},{x:w,y:-d,z:0},{x:w,y:d,z:0},{x:-w,y:d,z:0}];
 path(floor,"#17141f","#71627e");
 if(rigView.grid){
  for(let half=1;half<size.width*2;half++){const x=-w+half/2;line({x,y:-d,z:0},{x,y:d,z:0},half%2===0?"#bfa3d82b":"#a995bf16");}
  for(let half=1;half<size.depth*2;half++){const y=-d+half/2;line({x:-w,y,z:0},{x:w,y,z:0},half%2===0?"#bfa3d82b":"#a995bf16");}
 }
 if(rigView.mode==="2d")drawMetreScale(context,width,height);

 const sorted=data.lights.map((light,index)=>({light,index,screen:lightScreenPosition(light,index,width,height)})).filter(item=>fixturePlaced(item.light)).sort((a,b)=>a.screen.depth-b.screen.depth);
 for(const item of sorted){
  const {light,index}=item;
  const value=rigDisplayValue(light,step);
  if(value.level<=0)continue;
  const color=value.color;
  const rgb=[1,3,5].map(offset=>parseInt(color.slice(offset,offset+2),16));
  const alpha=Math.min(1,value.level/100);
  const point=rigWorld(light,index),beam=fixtureBeam(light,index),ground=project(beam.tip);
  if(rigView.mode==="3d"){
   const radius=fixtureKind(light)==="panel"?.8:.62;
   const ring=Array.from({length:24},(_,i)=>({x:beam.tip.x+Math.cos(i*Math.PI/12)*radius,y:beam.tip.y+Math.sin(i*Math.PI/12)*radius,z:beam.tip.z}));
   const source=project(point),left=project(ring[6]),right=project(ring[18]);
   const gradient=context.createLinearGradient(source.x,source.y,ground.x,ground.y);
   gradient.addColorStop(0,"rgba("+rgb+","+alpha*.28+")");gradient.addColorStop(1,"rgba("+rgb+",0)");
   context.fillStyle=gradient;context.beginPath();context.moveTo(source.x,source.y);context.lineTo(left.x,left.y);context.lineTo(right.x,right.y);context.closePath();context.fill();
   path(ring,"rgba("+rgb+","+alpha*.18+")",null);
  }
  const radius=(rigView.mode==="3d"?28:45)*rigView.zoom;
  const glow=context.createRadialGradient(ground.x,ground.y,0,ground.x,ground.y,radius);
  glow.addColorStop(0,"rgba("+rgb+","+alpha*.28+")");glow.addColorStop(1,"rgba("+rgb+",0)");
  context.fillStyle=glow;context.fillRect(ground.x-radius,ground.y-radius,radius*2,radius*2);
 }
 const audience=project({x:0,y:stageSize().depth/2+.35,z:0});
 context.fillStyle="#a89bb8";context.textAlign="center";context.font="10px system-ui";
 context.fillText("PUBLIKUM",audience.x,Math.min(height-10,audience.y));
}

function mappingDefaults(){return {dmx:{enabled:false,passthrough:false,routes:[]},artnet:{enabled:false,passthrough:false,routes:[]}};}
function validateMapping(input){
 const result=mappingDefaults();
 if(!input||typeof input!=="object")throw new Error("Ungültiges Mapping.");
 for(const kind of ["dmx","artnet"]){
  const table=input[kind]||result[kind];
  if(!table||!Array.isArray(table.routes))throw new Error("Ungültige Mapping-Zeilen.");
  const used=new Set();
  result[kind].enabled=table.enabled===true;result[kind].passthrough=table.passthrough===true;
  result[kind].routes=table.routes.map(route=>{
   const next={};
   for(const key of ["sourceChannel","targetChannel","count"]){
    const value=route[key];
    if(!Number.isInteger(value)||value<1||value>512)throw new Error("Kanäle und Länge müssen zwischen 1 und 512 liegen.");
    next[key]=value;
   }
   if(next.sourceChannel+next.count>513||next.targetChannel+next.count>513)throw new Error("Ein Kanalbereich endet hinter Kanal 512.");
   if(kind==="artnet"){
    for(const key of ["sourceUniverse","targetUniverse"]){
     if(!Number.isInteger(route[key])||route[key]<0||route[key]>32767)throw new Error("Portadressen müssen zwischen 0 und 32767 liegen.");
     next[key]=route[key];
    }
    const ip=route.sourceIP||"";
    if(typeof ip!=="string"||(ip!==""&&(!/^(\d{1,3}\.){3}\d{1,3}$/.test(ip)||ip.split(".").some(part=>Number(part)>255))))throw new Error("Ungültige Sender-IP.");
    next.sourceIP=ip;
   }
   for(let index=0;index<next.count;index++){
    const slot=(next.targetUniverse||0)+":"+(next.targetChannel+index);
    if(used.has(slot))throw new Error("Zielkanäle innerhalb einer Tabelle überschneiden sich.");
    used.add(slot);
   }
   return next;
  });
 }
 return result;
}

function validateStage(stage){
 if(stage===undefined)return {width:12,depth:8};
 if(!stage||![stage.width,stage.depth].every(value=>Number.isFinite(value)&&value>=1&&value<=50&&Number.isInteger(value*2)))throw new Error("Die Grundfläche muss zwischen 1 und 50 m liegen, in 0,5-m-Schritten.");
 return {width:stage.width,depth:stage.depth};
}
function stageSize(){try{return validateStage(data.stage)}catch{return {width:12,depth:8}}}
function snapPosition(position){
 const size=stageSize();
 return {x:Math.max(0,Math.min(size.width,Math.round(position.x*size.width*2)/2))/size.width,
  y:Math.max(0,Math.min(size.depth,Math.round(position.y*size.depth*2)/2))/size.depth};
}
function stageMetrics(width,height){
 const size=stageSize(),unit=Math.max(.01,Math.min((width-130)/size.width,(height-140)/size.depth));
 return {unit,left:(width-size.width*unit)/2,top:(height-size.depth*unit)/2+5,width:size.width*unit,height:size.depth*unit};
}
function projectTop(point,width,height){
 const stage=stageMetrics(width,height),size=stageSize();
 return {x:stage.left+(point.x+size.width/2)*stage.unit,y:stage.top+(point.y+size.depth/2)*stage.unit};
}
function drawMetreScale(context,width,height){
 const stage=stageMetrics(width,height),size=stageSize();
 context.strokeStyle="#8f7aa7";context.lineWidth=1;context.fillStyle="#cdbbdf";context.font="10px system-ui";
 function axis(length,horizontal){
  context.textAlign=horizontal?"center":"right";context.textBaseline=horizontal?"alphabetic":"middle";context.beginPath();
  for(let half=0;half<=length*2;half++){
   const metre=half/2,pixel=metre*stage.unit,major=half%2===0;
   if(horizontal){context.moveTo(stage.left+pixel,stage.top-15);context.lineTo(stage.left+pixel,stage.top-(major?8:11));}
   else{context.moveTo(stage.left-15,stage.top+pixel);context.lineTo(stage.left-(major?8:11),stage.top+pixel);}
   const spacing=Math.max(.5,Math.ceil(38/stage.unit*2)/2);
   if(metre===0||metre===length||Math.abs(metre/spacing-Math.round(metre/spacing))<.001){
    const label=String(metre).replace('.',',')+(metre===0||metre===length?' m':'');
    context.fillText(label,horizontal?stage.left+pixel:stage.left-21,horizontal?stage.top-23:stage.top+pixel);
   }
  }context.stroke();
 }
 axis(size.width,true);axis(size.depth,false);context.textBaseline="alphabetic";context.textAlign="center";
}
function automaticLightPosition(){
 const size=stageSize(),cols=Math.max(1,size.width*2-1),rows=Math.max(1,size.depth*2-1);
 const occupied=new Set(data.lights.map((light,index)=>({light,index})).filter(item=>fixturePlaced(item.light)).map(({light,index})=>{const p=fixturePosition(light,index);return Math.round(p.x*size.width*2)+':'+Math.round(p.y*size.depth*2)}));
 for(let row=1;row<=rows;row++)for(let col=1;col<=cols;col++)if(!occupied.has(col+':'+row))return {x:col/2/size.width,y:row/2/size.depth};
 return snapPosition({x:.5,y:.5});
}

function darkDuration(step){return Number.isFinite(step.darkHold)?step.darkHold:.25;}

function redrawPlayback(){

function advancePlayback(){
 const scene=running();if(!scene)return;
 if(stageIndex+1<scene.steps.length){stageIndex++;schedule();}
 else if(performQueue.size){
  const next=nextPerformScene(scene.id);if(next)play(next.id);else{performQueue.clear();active=null;liveSnapshot=null;outputStep=null;}
 }else if(auto){
  const choices=liveScenes(),index=choices.findIndex(item=>item.id===scene.id);if(choices.length)play(choices[(index+1)%choices.length].id);else auto=false;
 }else if(scene.loop){stageIndex=0;schedule();}
 redrawPlayback();
}
function schedule(){
 clearTimeout(timer);
 const step=running()?.steps[stageIndex];
 if(!step||override)return;
 playbackDark=false;
 outputFrame();
 if(djSync){djBeatCount=0;return;}
 timer=setTimeout(()=>{
  if(step.darkAfter){
   playbackDark=true;darkenOutput();redrawPlayback();
   timer=setTimeout(advancePlayback,1000*darkDuration(step));
  }else advancePlayback();
 },1000*stepDuration(step));
}
function advancePreview(scene,step){
 if(previewIndex===null)return;
 if(previewIndex+1<scene.steps.length){previewIndex++;previewTick();}
 else if(scene.loop){previewIndex=0;previewTick();}
 else{
  clearTimeout(previewTimer);previewIndex=null;previewDark=Boolean(step.darkAfter);render();
 }
}
function previewTick(){
 const scene=current(),step=scene?.steps[previewIndex];
 if(!step)return;
 previewDark=false;render();
 previewTimer=setTimeout(()=>{
  if(step.darkAfter){
   previewDark=true;
   if(setupToOutput)darkenOutput();
   render();previewTimer=setTimeout(()=>advancePreview(scene,step),1000*darkDuration(step));
  }else advancePreview(scene,step);
 },1000*stepDuration(step));
}

function validateMasterGroups(groups,lights){
 if(groups===undefined)return [];
 if(!Array.isArray(groups)||groups.length>32)throw new Error('Höchstens 32 Master-Gruppen sind möglich.');
 const used=new Set(),known=new Set(lights.map(light=>light.id));
 return groups.map(group=>{
  if(!group||typeof group.id!=='string'||!/^[-a-zA-Z0-9]+$/.test(group.id)||used.has(group.id)||typeof group.name!=='string'||!group.name.trim()||group.name.length>60||!Number.isFinite(group.level)||group.level<0||group.level>100||!Array.isArray(group.ids)||!group.ids.every(id=>known.has(id)))throw new Error('Ungültige Master-Gruppe.');
  if(group.collapsed!==undefined&&typeof group.collapsed!=='boolean')throw new Error('Ungültige Gruppenansicht.');
  used.add(group.id);return {id:group.id,name:group.name,level:group.level,ids:[...new Set(group.ids)],collapsed:group.collapsed===true};
 });
}
function applyGroupMasters(frame){
 const groups=data.masterGroups||[];if(!groups.length)return frame;
 const result=frame.slice();
 for(const light of data.lights){
  const levels=groups.filter(group=>group.ids.includes(light.id)).map(group=>group.level/100);
  if(!levels.length)continue;const factor=Math.min(...levels),map=channelMap(light);
  map.forEach((channel,index)=>{if(channel==='D'||(!map.includes('D')&&['R','G','B','W'].includes(channel)))result[light.address-1+index]=Math.round(result[light.address-1+index]*factor)});
 }
 return result;
}

 const groups=data.masterGroups||[],index=groups.findIndex(group=>group.id===draft.id),next=copy(groups);
 if(next.some(group=>group.id!==draft.id&&group.name.toLowerCase()===draft.name.trim().toLowerCase()))throw new Error('Dieser Gruppenname existiert bereits.');
 const group={...draft,name:draft.name.trim()};if(index<0)next.push(group);else next[index]=group;

function nextPerformScene(currentId,restart=false){
 const scenes=repeatScenes();if(!scenes.length)return null;
 if(data.playbackMode!=='random')return scenes[restart?0:(scenes.findIndex(scene=>scene.id===currentId)+1)%scenes.length];
 if(restart)shuffleBag=[];shuffleBag=shuffleBag.filter(id=>scenes.some(scene=>scene.id===id));
 if(!shuffleBag.length){
  shuffleBag=scenes.map(scene=>scene.id);
  for(let index=shuffleBag.length-1;index>0;index--){const other=Math.floor(Math.random()*(index+1));[shuffleBag[index],shuffleBag[other]]=[shuffleBag[other],shuffleBag[index]];}
  if(shuffleBag.length>1&&shuffleBag[0]===currentId)[shuffleBag[0],shuffleBag[1]]=[shuffleBag[1],shuffleBag[0]];
 }
 const id=shuffleBag.shift();return scenes.find(scene=>scene.id===id);
}
function moveQueue(id,direction){

}

function selectedProgramSteps(){
 const scene=current();if(!scene)return [];
 if(stepSelectionScene!==scene.id){selectedStepRefs.clear();stepSelectionScene=scene.id;}
 for(const step of selectedStepRefs)if(!scene.steps.includes(step))selectedStepRefs.delete(step);
 return scene.steps.filter(step=>selectedStepRefs.has(step));
}
function selectProgramStep(index,multiple){
 const scene=current(),step=scene?.steps[index];if(!step)return;
 selectedProgramSteps();
 if(!multiple){selectedStepRefs.clear();selectedStepRefs.add(step);stepIndex=index;return;}
 if(!selectedStepRefs.size&&scene.steps[stepIndex])selectedStepRefs.add(scene.steps[stepIndex]);
 if(selectedStepRefs.has(step))selectedStepRefs.delete(step);else selectedStepRefs.add(step);
 const selected=selectedProgramSteps();stepIndex=selected.length&&!selectedStepRefs.has(step)?scene.steps.indexOf(selected[0]):index;
}

 return '<section class="panel preset-edit scene-bank-panel"><h3>Szene</h3><form id="publish-form"><label class="stack">Bank auswählen<select id="program-bank" name="bank" aria-label="Bank auswählen">'+banks.map(name=>'<option value="'+esc(name)+'" '+(name===bank?'selected':'')+'>'+esc(name)+'</option>').join('')+'</select></label><div class="scene-picker-grid" role="group" aria-label="Szene auswählen">'+scenes.map(item=>button('<strong>'+performanceNumber(item)+'</strong><small>'+esc(item.buttonName||item.name)+'</small>','program-scene:'+item.id,'aria-label="Szene '+performanceNumber(item)+' · '+esc(item.buttonName||item.name)+'" '+flag(item===scene))).join('')+'</div><label class="stack">Szenenname<input id="control-name" maxlength="50" value="'+esc(scene?.name||'')+'" '+(!scene?'disabled':'')+'></label><input type="hidden" name="buttonName" value="'+esc(scene?.buttonName||scene?.name||'Neue Szene')+'"><label><input id="control-loop" type="checkbox" '+checked(scene?.loop)+'> Steps wiederholen</label><button class="primary" '+(!scene?'disabled':'')+'>Szene in dieser Bank speichern</button><small id="publish-notice" role="status"></small></form><div class="row">'+button('Neue Szene','program-new-scene')+button('Duplizieren','copy-scene',scene?'':'disabled')+'</div><details><summary>Neue Bank</summary><label class="stack">Bankname<input id="program-bank-name" maxlength="40" placeholder="Name der neuen Bank"></label>'+button('Bank anlegen','program-new-bank')+'</details></section>';
}
function selectProgrammingScene(id){
 const scene=data.scenes.find(item=>item.id===id);if(!scene)return;
 stopPreview();editing=id;stepIndex=0;loadSetupStep();effectLayerId=null;render();
}
function createProgrammingScene(bank){
 stopPreview();const scene={id:uid(),name:'Neue Szene',bank,live:false,loop:true,steps:[newStep()]};data.scenes.push(scene);editing=scene.id;stepIndex=0;loadSetupStep();save();render();return scene;
}
function selectProgrammingBank(bank){
 if(!allBanks().includes(bank))return;const scene=data.scenes.find(item=>bankName(item)===bank);if(scene)selectProgrammingScene(scene.id);else createProgrammingScene(bank);
}
document.addEventListener('change',event=>{if(event.target.id==='program-bank')selectProgrammingBank(event.target.value);});
document.addEventListener('click',event=>{
 const action=event.target.closest('[data-action]')?.dataset.action;
 if(action?.startsWith('program-scene:'))selectProgrammingScene(action.slice(14));
 if(action==='program-new-scene')createProgrammingScene(bankName(current()||{}));
 if(action==='program-new-bank'){
  const field=document.querySelector('#program-bank-name'),name=field.value.trim();if(!name)return;
  if(allBanks().some(bank=>bank.toLowerCase()===name.toLowerCase())){document.querySelector('#publish-notice').textContent='Diese Bank existiert bereits.';return;}
  data.banks=[...allBanks(),name];createProgrammingScene(name);
 }
});


let updatesDialogOpen=false,updateEpoch=0;
function updateVersionLabel(value){return Number(value)===25?'0.2.4':Number(value)===24?'0.2.3':value||'Browser-Demo';}
function updateDialogMarkup(){
 const info=updateInfo||{},busy=updateBusy,ready=(info.state==='ready'||Number(info.stagedVersion)>Number(info.runningVersion))&&Number(info.stagedVersion||info.version)>Number(info.runningVersion||0),available=info.state==='available';
 return '<h2>Software-Updates</h2><p>Installierte Version: '+esc(updateVersionLabel(info.runningVersion||(nativeAvailable?25:null)))+'</p><p class="update-message" role="status">'+esc(info.message||'Auf GitHub nach der neuesten stabilen Version für diesen Computer suchen.')+'</p>'+
 (busy?'<progress aria-label="Update-Fortschritt" max="100" '+(Number.isFinite(info.progress)?'value="'+info.progress+'"':'')+'></progress>':'')+
 '<div class="row">'+button('Nach Updates suchen','updates-check',(busy||!nativeAvailable?'disabled ':'')+'data-update-check')+button(ready?'Jetzt neu starten':'Herunterladen und neu starten',ready?'updates-restart':'updates-download-restart',(!nativeAvailable||busy||!available&&!ready?'disabled ':'')+'class="primary"')+'</div>'+
 '<small>Updates werden in deinem Benutzerprofil gespeichert. Vorherige Versionen bleiben erhalten. Deine Show wird vor dem Neustart gespeichert.</small>'+
 (!nativeAvailable?'<p>Diese Browser-Demo kann keine App-Updates installieren.</p>':'')+
 '<a href="https://github.com/whoisvision22/NullLight/releases/latest" target="_blank" rel="noreferrer">Vollständigen App-Download öffnen</a><div>'+button('Schließen / Abbrechen','updates-close')+'</div>';
}
function paintUpdateDialog(){const dialog=document.querySelector('#update-dialog');if(dialog&&updatesDialogOpen)dialog.innerHTML=updateDialogMarkup();}
function openUpdatesDialog(){updatesDialogOpen=true;updateEpoch++;paintUpdateDialog();const dialog=document.querySelector('#update-dialog');if(!dialog.open)dialog.showModal();}
async function closeUpdatesDialog(){
 updatesDialogOpen=false;updateEpoch++;const wasBusy=updateBusy;updateBusy=false;document.querySelector('#update-dialog')?.close();
 if(wasBusy&&nativeAvailable){try{await nativeRequest('/api/update/cancel',{});}catch{}}
}
async function checkUpdates(){
 if(!nativeAvailable||updateBusy)return;const epoch=updateEpoch;updateBusy=true;updateInfo={...(updateInfo||{}),message:'GitHub wird geprüft …',progress:null};paintUpdateDialog();
 try{const result=await nativeRequest('/api/update/check',{},45000);if(epoch===updateEpoch)updateInfo=result;}
 catch(error){if(epoch===updateEpoch)updateInfo={...(updateInfo||{}),state:'error',message:'Update-Prüfung fehlgeschlagen: '+error.message};}
 finally{if(epoch===updateEpoch){updateBusy=false;paintUpdateDialog();}}
}
async function downloadAndRestart(){
 if(!nativeAvailable||updateBusy)return;const epoch=updateEpoch;updateBusy=true;updateInfo={...(updateInfo||{}),state:'downloading',progress:0,message:'Update wird heruntergeladen und geprüft …'};paintUpdateDialog();
 try{
  let result=await nativeRequest('/api/update/start',{},10000);
  if(epoch!==updateEpoch){await nativeRequest('/api/update/cancel',{});return;}
  while(updatesDialogOpen&&epoch===updateEpoch){
   updateInfo=result;paintUpdateDialog();
   if(result.state==='ready'){updateBusy=false;restartForUpdate();return;}
   if(['error','cancelled','unavailable'].includes(result.state))break;
   await new Promise(resolve=>setTimeout(resolve,400));result=await nativeRequest('/api/update/status');
  }
 }catch(error){if(epoch===updateEpoch)updateInfo={...(updateInfo||{}),state:'error',message:'Update fehlgeschlagen: '+error.message};}
 finally{if(epoch===updateEpoch){updateBusy=false;paintUpdateDialog();}}
}
function selectAllProgramSteps(){const scene=current();if(!scene||previewIndex!==null)return;selectedProgramSteps();scene.steps.forEach(step=>selectedStepRefs.add(step));render();}
document.addEventListener('click',event=>{const action=event.target.closest('[data-action]')?.dataset.action;if(action==='updates-download-restart')downloadAndRestart();else if(action==='updates-close')closeUpdatesDialog();else if(action==='steps-select-all')selectAllProgramSteps();});
document.addEventListener('cancel',event=>{if(event.target.id==='update-dialog'){event.preventDefault();closeUpdatesDialog();}},true);
document.addEventListener('selectstart',event=>{if(event.target.closest?.('.rig-canvas'))event.preventDefault();});

render();
</script>
