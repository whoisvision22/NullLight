name: NullLight version pruefen und veroeffentlichen
on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
concurrency:
  group: nulllight-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  windows-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run test:demo
      - run: npm run build:demo
      - run: npm run build:pi
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - run: gem install webrick --no-document
      - run: npm run test:pi
      - run: ruby tests/updater-check.rb
      - name: Demo verpacken
        working-directory: dist
        run: |
          VERSION=$(node -p '(require("../version.json").displayVersion || require("../version.json").version)')
          zip -qr "NullLight-Windows-Demo-v${VERSION}.zip" NullLight-Windows-Demo
          zip -qr "NullLight-Raspberry-Pi-v${VERSION}.zip" NullLight-Raspberry-Pi
      - uses: actions/upload-artifact@v4
        with:
          name: windows-demo
          path: dist/*.zip
  mac:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: /usr/bin/ruby tests/updater-check.rb
      - run: /usr/bin/ruby scripts/build-mac.rb
      - run: /usr/bin/lipo dist/NullLight.app/Contents/MacOS/applet -verify_arch x86_64 arm64
      - uses: actions/upload-artifact@v4
        with:
          name: mac-app-and-update
          path: |
            dist/*.zip
            dist/NullLight-update.json
            dist/NullLight-release-*.json
  release:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [windows-demo, mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Neue Version mit Downloads und Update-Quelle veroeffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p '(require("./version.json").displayVersion || require("./version.json").version)')
          if gh release view "v${VERSION}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Version ${VERSION} ist bereits veroeffentlicht. Fuer ein neues Release version.json erhoehen."
            exit 0
          fi
          sha256sum dist/*.zip dist/*.json > dist/SHA256SUMS
          gh release create "v${VERSION}" dist/*.zip dist/*.json dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest \
            --title "NullLight v${VERSION}" --notes-file RELEASE-NOTES.md
